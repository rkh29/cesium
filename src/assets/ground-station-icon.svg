<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c040"/>
      <stop offset="0.5" stop-color="#d49820"/>
      <stop offset="1" stop-color="#a07010"/>
    </linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c0c8d0"/>
      <stop offset="1" stop-color="#809098"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- 底座三角架 -->
    <line x1="36" y1="82" x2="48" y2="68" stroke="#809098" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="82" x2="48" y2="68" stroke="#809098" stroke-width="3" stroke-linecap="round"/>
    <line x1="30" y1="86" x2="66" y2="86" stroke="#607080" stroke-width="4" stroke-linecap="round"/>

    <!-- 立柱 -->
    <rect x="45" y="48" width="6" height="22" rx="2" fill="url(#pole)" stroke="#e0e8f0" stroke-width="1"/>

    <!-- 抛物面天线 -->
    <path d="M28 52 Q28 16 48 14 Q68 16 68 52"
      fill="url(#dish)" stroke="#ffea80" stroke-width="2"/>

    <!-- 馈源支架 -->
    <line x1="48" y1="42" x2="48" y2="24" stroke="#e0e8f0" stroke-width="2" stroke-linecap="round"/>

    <!-- 馈源 -->
    <circle cx="48" cy="22" r="4" fill="#ffdd73" stroke="#fff7c2" stroke-width="1.5"/>

    <!-- 信号波纹 -->
    <path d="M36 44 Q40 38 44 44" stroke="#80e8ff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M32 48 Q38 36 44 48" stroke="#80e8ff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
    <path d="M28 52 Q36 34 44 52" stroke="#80e8ff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.3"/>
  </g>
</svg>